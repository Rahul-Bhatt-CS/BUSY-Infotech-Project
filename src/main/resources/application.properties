# Application Name
spring.application.name=learnWithUs

server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnwithus?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT
jwt.secret=${JWT_SECRET:very-long-and-secure-random-secret-key-that-should-be-at-least-256-bits}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# Lesson file uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB